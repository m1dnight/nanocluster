---
argument_specs:
  main:
    short_description: Write the shared Erlang cookie and the cluster hosts file for an existing account
    options:
      erlang_setup_user:
        type: str
        description: Existing account whose home receives .erlang.cookie and .hosts.erlang.
      erlang_setup_cookie:
        type: str
        required: true
        description: Shared cookie containing 1-255 printable ASCII characters without whitespace.
      erlang_setup_hosts_group:
        type: str
        description: Inventory group whose members are listed in .hosts.erlang by ansible_host.
      erlang_setup_hosts:
        type: list
        elements: str
        description: Explicit host names for .hosts.erlang; overrides the group when set.
