---
# ---------------------------------------------------------------------------
# Install basic packages

- name: install aptitude
  become: true
  apt:
    name: aptitude
    state: latest
    update_cache: true

- name: install basic system packages
  become: true
  apt:
    pkg: "{{ item }}"
    state: latest
    update_cache: true
  with_items: "{{ packages }}"

#---------------------------------------------------------------------------
# Hostname

- name: add local hostname {{ ansible_host }} to /etc/hosts
  become: true
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1       {{ ansible_host }} {{ inventory_hostname_short }}"

