---
# Shared toolchain for all nodes.
go_version: "1.25.5"
go_platform: linux
go_arch: arm64
go_checksum: "b00b694903d126c588c378e72d3545549935d3982635ba3f7a964c9fa23fe3b9"

packages_add_list:
  - git
  - rsync
  - just
  - tmux
  - emacs-nox
  - nfs-common
  - tree
  - ncdu
  - net-tools
  - make
  # erlang deps
  - build-essential
  - libssl-dev
  - curl
  - ca-certificates
  - unzip
  - autoconf
  - m4
  - libwxgtk3.2-dev
  - libwxgtk-webview3.2-dev
  - libgl1-mesa-dev
  - libglu1-mesa-dev
  - libpng-dev
  - libssh-dev
  - unixodbc-dev
  - xsltproc
  - fop
  - libxml2-utils
  - libncurses-dev

asdf_plugins:
  - name: "erlang"
    repository: "https://github.com/asdf-vm/asdf-erlang.git"
    version: latest

  - name: "elixir"
    repository: https://github.com/asdf-vm/asdf-elixir.git
    version: latest

# Folder mirrored to every node by `just sync`. Node files absent locally are deleted.
sync_source: ~/Documents/Code/elixir/distexample
sync_destination: /home/pi/distexample
sync_excludes:
  - .DS_Store
  - _build

# Elixir release run as a systemd service by `just elixir_app`. Unpack the release
# on each node first; the path is usually a symlink to the active version.
elixir_app_name: distexample
elixir_app_release_path: /home/pi/distexample/_build/prod/rel/distexample/
elixir_app_environment:
  PHX_SERVER: "true"
  PORT: "4000"

# Directory mirrored from one node to all others by `just mirror`. Files absent on
# the source node are deleted elsewhere. The source node gets an SSH key for this.
mirror_source_host: nanocluster1
mirror_source_path: /home/pi/distexample
mirror_excludes:
  - .DS_Store
