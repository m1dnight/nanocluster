---
# SSH keys come from your SSH agent/config or --private-key.
ansible_user: pi

ssh_keys_users:
  - pi

# Public key only; the matching private key stays on your computer.
ssh_keys_public_key: >-
  ssh-rsa
  
  christophe@bloempot


erlang_setup_cookie: nanoclustercookies

erlang_setup_hosts: "{{ groups['nodes'] | map('extract', hostvars, 'ansible_host') | list }}"
