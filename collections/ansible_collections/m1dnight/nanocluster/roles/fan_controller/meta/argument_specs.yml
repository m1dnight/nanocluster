---
argument_specs:
  main:
    short_description: Install and run the shared fan controller
    options:
      fan_controller_path:
        type: path
        description: Absolute directory for the controller script.
      fan_controller_script_name:
        type: str
        description: Python script filename.
      fan_controller_speed:
        type: float
        description: Fixed PWM duty cycle from 0 to 100 percent.
      fan_controller_gpio_pin:
        type: int
        description: BCM GPIO number connected to the fan controller.
      fan_controller_pwm_frequency:
        type: int
        description: Positive PWM frequency in Hz.
      fan_controller_packages:
        type: list
        elements: str
        description: Debian packages providing Python and the RPi.GPIO API.
