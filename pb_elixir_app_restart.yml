---
- name: Restart the Elixir release service on all nodes
  hosts: nodes
  gather_facts: false
  become: true
  # One node at a time so a clustered application keeps serving.
  serial: "{{ elixir_app_serial | default(1) }}"
  tasks:
    - name: Require the configured service name
      ansible.builtin.assert:
        that:
          - elixir_app_name | default('') | length > 0
        fail_msg: Set elixir_app_name in inventory/group_vars/nodes.yml.

    - name: Restart the service
      ansible.builtin.systemd_service:
        name: "{{ elixir_app_name }}"
        state: restarted
